# Btrfs is the default so every install gets snapshots and rollback.
---
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 1024MiB
    minimumSize: 300MiB
    label: "EFI"

# Swap is provided by zram (see /etc/systemd/zram-generator.conf).
userSwapChoices:
    - none
    - file
initialSwapChoice: none

luksGeneration: luks1
enableLuksAutomatedPartitioning: true
preCheckEncryption: false
drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
showNotEncryptedBootMessage: false

initialPartitioningChoice: erase
defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs" ]
essentialMounts: [ "live-*", "control", "ventoy" ]
lvm:
    enable: false
requiredStorage: 20

# One administrator account; root stays locked and sudo asks for the user's password.
---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - lp
    - video
    - network
    - storage
    - name: wheel
      must_exist: false
      system: true
    - audio
    - rfkill
sudoersGroup: wheel
sudoersConfigureWithGroup: false
setRootPassword: false
doReusePassword: true
displayAutologin: true
doAutologin: false
passwordRequirements:
    minLength: 4
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: true
user:
    shell: /bin/bash
    forbidden_names: [ root, live ]
    home_permissions: "o700"
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "${first}-alnix"
    forbidden_names: [ localhost ]

# Alnix installer configuration. Module configs live in modules/,
# branding in branding/alnix/.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id: copykernel
  module: shellprocess
  config: shellprocess-copykernel.conf
- id: cleanup
  module: shellprocess
  config: shellprocess-cleanup.conf
- id: finalize
  module: shellprocess
  config: shellprocess-finalize.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - locale
  - keyboard
  - localecfg
  - fstab
  - shellprocess@copykernel
  - shellprocess@cleanup
  - luksbootkeyfile
  - initcpiocfg
  - initcpio
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - grubcfg
  - bootloader
  - shellprocess@finalize
  - umount
- show:
  - finished

branding: alnix
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
